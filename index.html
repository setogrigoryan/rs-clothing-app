<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Clothing Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1a1a1a);
            --hint-color: var(--tg-theme-hint-color, #707579);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .header p {
            color: var(--hint-color);
            font-size: 14px;
            margin-top: 5px;
        }

        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        /* Gallery/Slider styles */
        .main-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .thumbnails {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
        }

        .thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.6;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .thumb.active {
            opacity: 1;
            border-color: var(--button-color);
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 4px 0;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 13px;
            color: var(--hint-color);
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .buy-btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ RS Clothing Shop</h1>
        <p>Ընտրեք ապրանքը և պատվիրեք 1-click-ով</p>
    </div>

    <div class="product-grid" id="products-container">
        <!-- Ապրանքները ավտոմատ կավելանան JS-ով -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // -------------------------------------------------------------
        // 🛒 ԱՅՍՏԵՂ ԱՎԵԼԱՑՐՈՒ ԿԱՄ ՓՈԽԻՐ ՔՈ ԱՊՐԱՆՔՆԵՐԸ
        // -------------------------------------------------------------
        const products = [
            {
                id: 1,
                name: "RS Oversize Black Hoodie",
                price: 15000,
                description: "Բարձր որակի 100% բամբակյա oversize հուդի: Հարմարավետ, տաք և ոճային:",
                images: [
                    "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500", // Նկար 1
                    "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?w=500", // Նկար 2
                    "https://images.unsplash.com/photo-1578587018452-892bacefd3f2?w=500"  // Նկար 3
                ]
            },
            {
                id: 2,
                name: "RS Streetwear Cargo Pants",
                price: 12000,
                description: "Տաբատ կողային գրպաններով, բարձրորակ կտոր, չի կորցնում գույնը լվանալիս:",
                images: [
                    "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500",
                    "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=500"
                ]
            }
        ];

        // Ապրանքները էկրանին ցույց տալու ֆունկցիա
        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';

                // Փոքր նկարների (thumbnails) HTML-ը
                let thumbsHTML = '';
                product.images.forEach((img, index) => {
                    thumbsHTML += `
                        <img src="${img}" 
                             class="thumb ${index === 0 ? 'active' : ''}" 
                             onclick="changeImage(this, '${product.id}', '${img}')">
                    `;
                });

                card.innerHTML = `
                    <img src="${product.images[0]}" id="main-img-${product.id}" class="main-img" alt="${product.name}">
                    <div class="thumbnails">${thumbsHTML}</div>
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} Դրամ</div>
                    <div class="product-desc">${product.description}</div>
                    <button class="buy-btn" onclick="sendOrder('${product.name}', ${product.price})">🛒 Պատվիրել</button>
                `;

                container.appendChild(card);
            });
        }

        // Նկարը փոխելու ֆունկցիա (slider-ի համար)
        function changeImage(thumbElement, productId, newSrc) {
            document.getElementById(`main-img-${productId}`).src = newSrc;
            const parent = thumbElement.parentElement;
            parent.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        // Պատվերը Telegram Bot-ին ուղարկելու ֆունկցիա
        function sendOrder(itemName, price) {
            const data = { item: itemName, price: price };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        // Գործարկել ապրանքների ցուցադրումը
        renderProducts();
    </script>
</body>
</html>
