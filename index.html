<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Clothing Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1a1a1a);
            --hint-color: var(--tg-theme-hint-color, #707579);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin: 0; }
        .badge {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .admin-box {
            background-color: var(--card-bg);
            border: 2px dashed #ff9800;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .admin-box input, .admin-box textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .main-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #e53935;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ RS Clothing Shop</h1>
        <div id="role-badge"></div>
    </div>

    <!-- ԱԴՄԻՆ ՊԱՆԵԼ -->
    <div id="admin-panel" class="admin-box">
        <h3>👑 Ադմին Պանել (Ավելացնել ապրանք)</h3>
        <input type="text" id="p-name" placeholder="Ապրանքի անունը">
        <input type="number" id="p-price" placeholder="Գինը (դրամ)">
        <input type="text" id="p-img" placeholder="Նկարի հղումը (URL)">
        <textarea id="p-desc" placeholder="Նկարագրություն"></textarea>
        <button class="btn" onclick="addNewProduct()">➕ Ավելացնել Խանութում</button>
    </div>

    <!-- ԱՊՐԱՆՔՆԵՐԻ ՑՈՒՑԱԿ -->
    <div id="products-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 🎯 ՔՈ ԻՐԱԿԱՆ TELEGRAM ID-Ն
        const ADMIN_ID = 1019650128;

        // Ստանում ենք օգտատիրոջ Telegram ID-ն
        const user = tg.initDataUnsafe?.user;
        const currentUserId = user ? user.id : null;
        
        // Ստուգում ենք՝ ադմի՞նն է, թե՞ ոչ
        let isAdmin = (currentUserId === ADMIN_ID);

        // Սկզբնական ապրանք
        let defaultProducts = [
            {
                id: 1,
                name: "RS Oversize Black Hoodie",
                price: 15000,
                img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500",
                desc: "100% բամբակյա oversize հուդի:"
            }
        ];

        let products = JSON.parse(localStorage.getItem('rs_products')) || defaultProducts;

        function initApp() {
            const badge = document.getElementById('role-badge');
            
            if (isAdmin) {
                badge.innerHTML = `<span class="badge">👑 ԱԴՄԻՆ ՌԵԺԻՄ</span>`;
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                badge.innerHTML = `<span style="color: var(--hint-color); font-size: 13px;">Գնորդի ռեժիմ</span>`;
            }

            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';

                let deleteBtn = isAdmin ? `
                    <button class="btn btn-delete" onclick="deleteProduct(${index})">🗑️ Ջնջել ապրանքը</button>
                ` : '';

                card.innerHTML = `
                    <img src="${product.img}" class="main-img" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <div style="font-weight: bold; color: #2e7d32; margin-bottom: 5px;">${product.price.toLocaleString()} Դրամ</div>
                    <p style="font-size: 13px; color: var(--hint-color);">${product.desc}</p>
                    ${!isAdmin ? `<button class="btn" onclick="sendOrder('${product.name}', ${product.price})">🛒 Պատվիրել</button>` : ''}
                    ${deleteBtn}
                `;

                container.appendChild(card);
            });
        }

        function addNewProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const desc = document.getElementById('p-desc').value;

            if (!name || !price || !img) {
                alert("Խնդրում ենք լրացնել անունը, գինը և նկարի հղումը!");
                return;
            }

            const newProd = { id: Date.now(), name, price: Number(price), img, desc };
            products.push(newProd);
            
            localStorage.setItem('rs_products', JSON.stringify(products));
            renderProducts();

            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-img').value = '';
            document.getElementById('p-desc').value = '';
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            localStorage.setItem('rs_products', JSON.stringify(products));
            renderProducts();
        }

        function sendOrder(itemName, price) {
            const data = { item: itemName, price: price };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        initApp();
    </script>
</body>
</html>
