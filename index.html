<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Clothing Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            padding: 15px;
            margin: 0;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .grid { display: flex; flex-direction: column; gap: 15px; }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }
        .card img {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
            object-fit: cover;
        }
        .price {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.1em;
            margin: 8px 0;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🛍️ RS Clothing</h2>
    
    <div class="grid">
        <div class="card">
            <img src="https://picsum.photos/300/300?random=1" alt="Hoodie">
            <h3>RS Oversize Hoodie</h3>
            <div class="price">15,000 Դրամ</div>
            <button class="btn" onclick="sendOrder('RS Oversize Hoodie', 15000)">Պատվիրել</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/300?random=2" alt="Pants">
            <h3>RS Cargo Pants</h3>
            <div class="price">12,000 Դրամ</div>
            <button class="btn" onclick="sendOrder('RS Cargo Pants', 12000)">Պատվիրել</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendOrder(itemName, price) {
            const data = { item: itemName, price: price };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
